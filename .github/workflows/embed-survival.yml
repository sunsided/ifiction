name: Embed survival

# Checks on Linux, macOS and Windows that the embedded IFID and iFiction record survive
# fat LTO, stripping and each platform's linker (scripts/verify-embed.sh). Manual only:
# it is slow and only needs to run when the embedding or the toolchain changes.
on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Rust toolchain
        required: false
        default: stable
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  survival:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify embedding
        shell: bash
        run: scripts/verify-embed.sh
