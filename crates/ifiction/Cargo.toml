[package]
name = "ifiction"
description = "Treaty of Babel metadata for interactive fiction: IFIDs, iFiction records, HTML and binary embedding"
keywords = ["interactive-fiction", "ifid", "ifiction", "babel", "metadata"]
categories = ["game-development", "parser-implementations", "encoding"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# A game that only embeds generated metadata (`include_generated!`) needs none of these.
default = ["read", "detect", "generate"]
# Parse iFiction XML.
read = ["dep:quick-xml"]
# Find IFIDs in arbitrary files, including the MD5 fallbacks of the Treaty.
detect = ["read", "dep:md-5"]
# Generate new UUID-based IFIDs.
generate = ["dep:uuid"]
serde = ["dep:serde"]

[dependencies]
md-5 = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.release]
pre-release-replacements = [
  # Turn the pending notes into the release's section and open a fresh [Unreleased] above it.
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Later releases: point [Unreleased] at the new tag and add a compare link.
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", min = 0, max = 1 },
  # First release: there is no earlier tag to compare with.
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/commits/main", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/releases/tag/{{tag_name}}", min = 0, max = 1 },
]
